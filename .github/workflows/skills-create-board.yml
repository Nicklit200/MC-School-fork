name: Create skills board verification
on:
  push:
    branches: [feature/skills-grade9-create-20261102]
  pull_request:
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/skills/**'
      - 'backend/src/test/java/com/mcschool/flashcard/skills/**'
      - 'frontend/public/skills-board/**'
      - '.github/workflows/skills-create-board.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: skills_test
          POSTGRES_PASSWORD: skills_test
          POSTGRES_DB: skills_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run skills tests against PostgreSQL
        working-directory: backend
        env:
          SKILLS_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/skills_test
        run: mvn -B '-Dtest=SkillBoard*Test' test
      - name: Build backend
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Validate frontend syntax
        run: node --check frontend/public/skills-board/board.js
