# Full production-style stack: PostgreSQL + backend API + nginx-served frontend.
# The frontend proxies /api to the backend, so browsers hit a single origin.
#
#   cp .env.prod.example .env   # then fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The app is then reachable at http://<host>/ and stays up independently of any
# developer's laptop.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      # Refuse to start if the insecure built-in dev secret is used in production.
      JWT_FAIL_ON_INSECURE_SECRET: "true"
      # Public origin(s); also used for email activation/login links.
      CORS_ALLOWED_ORIGINS: ${PUBLIC_BASE_URL}
      FRONTEND_BASE_URL: ${PUBLIC_BASE_URL}
      # First admin, created once on startup.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      # Google Drive service-account JSON. Keep the real value only in .env / secret storage.
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      MAX_UPLOAD_FILE_SIZE: ${MAX_UPLOAD_FILE_SIZE:-20MB}
      MAX_UPLOAD_REQUEST_SIZE: ${MAX_UPLOAD_REQUEST_SIZE:-20MB}
      # Email (optional). Leave MAIL_ENABLED=false to log instead of send.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      REVIEW_REMINDERS_ENABLED: ${REVIEW_REMINDERS_ENABLED:-false}

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin API path; nginx proxies it to the backend.
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  pgdata:
