<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход · Tsubera</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}.card{max-width:420px;width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:28px}h1{margin:0 0 9px;font-size:27px}p{color:#6b7280;font-size:14px;line-height:1.5}label{display:block;font-size:14px;margin:24px 0 8px}input{width:100%;font:inherit;padding:12px;border:1px solid #dfe3ea;border-radius:10px}button{margin-top:16px;width:100%;background:#111827;color:white;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#error{color:#b91c1c;min-height:22px;margin-bottom:0}
</style></head>
<body><main class="card"><h1>Tsubera</h1><p>Рейсы и транспортные документы</p><form id="login"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">Войти</button><p id="error" role="alert" aria-live="polite"></p></form></main>
<script>
document.getElementById('login').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const result=await fetch('/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const data=await result.json();if(!result.ok)throw new Error(data.error||'Не удалось войти');location.replace('/')}catch(e){error.textContent=e.message}finally{button.disabled=false}});
</script></body></html>
