name: Online classroom pilot gate

on:
  pull_request:
    paths:
      - "backend/src/main/java/com/mcschool/flashcard/auth/OnlineClassPilotAuthorizationManager.java"
      - "backend/src/main/java/com/mcschool/flashcard/config/SecurityConfig.java"
      - "backend/src/test/java/com/mcschool/flashcard/auth/OnlineClassPilotAuthorizationManagerTest.java"
      - "backend/src/main/resources/application.properties"
      - ".github/workflows/online-class-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization:
    name: Owner-only and student access tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify pilot authorization
        working-directory: backend
        run: ./mvnw -B -ntp -Dtest=OnlineClassPilotAuthorizationManagerTest test
