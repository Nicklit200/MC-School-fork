name: Lesson entry validation
on:
  push:
    branches: ['verify/lesson-day-access-20261024']
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Package source and public test dependencies
        run: |
          git archive --format=tar.gz HEAD > /tmp/lesson-entry-source.tar.gz
          tar -czf /tmp/frontend-test-deps.tar.gz -C frontend node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: lesson-entry-source
          path: /tmp/lesson-entry-source.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-test-deps
          path: /tmp/frontend-test-deps.tar.gz
          retention-days: 1
