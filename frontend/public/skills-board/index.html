<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mindcrafti · Навыки</title><link rel="stylesheet" href="./board.css?v=4"></head><body><div id="app">
<header class="bar"><div class="brand-icon">M</div><div class="headings"><div class="eyebrow">MINDCRAFTI / УЧЕБНАЯ ПРОГРАММА</div><h1>Карта навыков <span id="board-grade" class="grade">6 класс</span></h1></div><span class="draft-badge">Черновик программы</span><span id="save-state" role="status">Подключение…</span><button id="save" class="primary" disabled>Сохранить</button></header>
<div class="toolbar"><button id="add" class="primary" disabled>＋ Навык</button><button id="add-topic" disabled>＋ Раздел</button><span class="separator"></span><button id="connect" disabled title="Выберите две карточки или потяните за точку на карточке">↗ Соединить</button><select id="edge-kind" aria-label="Тип новой связи"><option value="prerequisite">Нужно знать прежде</option><option value="contains">Входит в тему</option></select><span class="separator"></span><label class="student-filter"><span>Программа</span><select id="board-filter" aria-label="Выбрать программу"><option value="grade-6">6 класс</option><option value="grade-8-m8">8 класс · M8</option></select></label><span class="separator"></span><label class="student-filter"><span>Ученик</span><select id="student-filter" aria-label="Выбрать ученика" disabled><option value="">Без ученика · 0%</option></select></label><span class="separator"></span><div class="view-switch" role="group" aria-label="Вид карты"><span class="view-switch-label">Вид</span><button id="view-free" class="active" type="button" title="Свободная доска с сохранённым расположением">Карта</button><button id="view-hierarchy" type="button" title="Автоматически показать всю иерархию">Дерево</button></div><span class="separator"></span><button id="undo" disabled title="Ctrl+Z">↶ Отменить</button><button id="export" disabled>JSON ↓</button><label class="check"><input type="checkbox" id="prerequisites" checked>Предпосылки</label><button id="fullscreen" title="Развернуть доску">⛶</button></div>

<aside id="inspector" class="inspector"><div class="inspector-head"><strong id="inspector-heading">Как работать</strong><button id="close-inspector" title="Закрыть карточку">×</button></div><div id="inspector-body"></div></aside></div></div><script type="module" src="./board.js?v=4"></script></body></html>
