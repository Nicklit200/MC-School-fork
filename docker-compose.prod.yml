# Full production-style stack: PostgreSQL + backend API + nginx-served frontend.
# The frontend proxies /api to the backend, so browsers hit a single origin.
#
#   cp .env.prod.example .env   # then fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The app is then reachable at http://<host>/ and stays up independently of any
# developer's laptop.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      # Refuse to start if the insecure built-in dev secret is used in production.
      JWT_FAIL_ON_INSECURE_SECRET: "true"
      # Public origin(s); also used for email activation/login links.
      CORS_ALLOWED_ORIGINS: ${PUBLIC_BASE_URL}
      FRONTEND_BASE_URL: ${PUBLIC_BASE_URL}
      # First admin, created once on startup.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      # Email (optional). Leave MAIL_ENABLED=false to log instead of send.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      REVIEW_REMINDERS_ENABLED: ${REVIEW_REMINDERS_ENABLED:-false}

  # Optional: only needed when online-class transcription is enabled.
  # Scale to 0 (or omit) to run without it — the class works regardless.
  transcription-agent:
    build:
      context: ./services/transcription-agent
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_AGENT_NAME: ${ONLINE_CLASS_TRANSCRIPTION_AGENT:-mc-transcriber}
      # STT credential: this service only.
      SONIOX_API_KEY: ${SONIOX_API_KEY:-}
      MCSCHOOL_API_BASE_URL: http://backend:8080/api/v1
      TRANSCRIPTION_INTERNAL_TOKEN: ${TRANSCRIPTION_INTERNAL_TOKEN:-}
      TRANSCRIPTION_LANGUAGES: ${TRANSCRIPTION_LANGUAGES:-ru,de}

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin API path; nginx proxies it to the backend.
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Origins the browser may open a LiveKit signalling connection to.
      # Leave empty when online classes are disabled — the CSP then stays
      # exactly as strict as before the feature existed.
      LIVEKIT_CSP_ORIGINS: ${LIVEKIT_CSP_ORIGINS:-}
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  pgdata:
