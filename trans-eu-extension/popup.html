<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tsubera Capture</title>
  <style>
    body{margin:0;width:330px;font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f6f8fb}
    main{padding:16px}
    h1{font-size:16px;margin:0 0 4px}
    p{margin:0 0 14px;color:#61708a;font-size:12px}
    label{display:block;font-weight:650;margin:12px 0 5px}
    input[type=password]{width:100%;box-sizing:border-box;border:1px solid #d5dce8;border-radius:9px;padding:9px 10px;background:#fff}
    .row{display:flex;gap:8px;margin-top:14px}
    button{flex:1;border:0;border-radius:9px;padding:10px 12px;font-weight:700;cursor:pointer}
    #save{background:#0b6bcb;color:#fff}
    #scan{background:#e9eef6;color:#21314b}
    .toggle{display:flex;align-items:center;gap:8px;margin-top:12px}
    #status{margin-top:12px;padding:9px 10px;border-radius:9px;background:#fff;border:1px solid #e1e6ef;font-size:12px;white-space:pre-line}
    .ok{color:#167447}.bad{color:#a82a2a}
  </style>
</head>
<body>
<main>
  <h1>Tsubera × Trans.eu</h1>
  <p>Собирает только рейсы, которые уже показаны в твоей авторизованной вкладке Trans.eu.</p>

  <label for="password">Пароль подключения</label>
  <input id="password" type="password" autocomplete="off" placeholder="Введите пароль">

  <label class="toggle"><input id="enabled" type="checkbox"> Автосбор каждые 30 секунд</label>

  <div class="row">
    <button id="save">Сохранить</button>
    <button id="scan">Сканировать сейчас</button>
  </div>

  <div id="status">Загрузка…</div>
</main>
<script src="popup.js"></script>
</body>
</html>
