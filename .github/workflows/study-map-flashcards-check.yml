name: Study Map flashcards checks
on:
  push:
    branches: [personal-study-map]
    paths:
      - 'personal-study-map/**'
      - '.github/workflows/study-map-flashcards-check.yml'
  pull_request:
    paths:
      - 'personal-study-map/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all JavaScript syntax
        run: |
          find personal-study-map -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Test spaced repetition
        run: node --test personal-study-map/tests/review-schedule.test.mjs
      - name: Ensure flashcard module is included
        run: |
          grep -q 'id="flashcard-panel"' personal-study-map/index.html
          grep -q 'src="./flashcards.js?' personal-study-map/index.html
