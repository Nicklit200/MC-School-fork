# Dedicated disposable staging database.
# This profile intentionally does not use Railway/Postgres or any production data.
spring.datasource.url=jdbc:h2:mem:mindcrafti-staging;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Build the schema from JPA entities on every staging-api restart.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# Staging must only contain disposable demo fixtures.
STAGING_FIXTURES_ENABLED=true
