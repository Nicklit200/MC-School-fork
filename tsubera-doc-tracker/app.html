<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tsubera Documents</title><style>
body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f5f7fb;color:#111827}main{max-width:1200px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;background:#111827;color:#fff}.btn.alt{background:white;color:#111827;border:1px solid #dfe3ea}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.card,.panel{background:white;border:1px solid #e5e7eb;border-radius:16px}.card{padding:16px}.card b{display:block;font-size:28px;margin-top:6px}.toolbar{display:flex;gap:10px;padding:12px}.toolbar input{flex:1;border:1px solid #dfe3ea;border-radius:10px;padding:10px}.row,.head{display:grid;grid-template-columns:105px 1.1fr 1fr 70px 70px 70px 150px 130px 170px 34px;align-items:center;padding:11px 12px}.head{font-size:12px;color:#6b7280;background:#fafafa;border-top:1px solid #eee;border-bottom:1px solid #eee}.row{border-bottom:1px solid #eee;font-size:14px}.row input[type=checkbox]{width:18px;height:18px}.rn{width:100%;border:1px solid #dfe3ea;border-radius:8px;padding:8px}.status{font-size:12px;padding:6px 9px;border-radius:999px;display:inline-block}.ok{background:#e8f7ef;color:#087443}.wait{background:#fff4d6;color:#925f00}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{background:white;border-radius:16px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}.field input,.field select{padding:10px;border:1px solid #dfe3ea;border-radius:9px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.docs{display:flex;flex-direction:column;gap:8px}.doc{display:grid;grid-template-columns:100px 1fr auto;gap:8px;align-items:center;border:1px solid #eee;border-radius:10px;padding:9px}.muted{color:#6b7280;font-size:12px}@media(max-width:900px){.stats{grid-template-columns:1fr}.head{display:none}.row{grid-template-columns:1fr 1fr;gap:10px}.row>div:before{content:attr(data-label);display:block;font-size:11px;color:#6b7280}}
</style></head><body><main><div class="top"><div><h1>Tsubera · Transport Documents</h1><div class="muted">Серверная база + документы + готовность к Rechnung</div></div><button class="btn" id="add">+ Добавить рейс</button></div><div class="stats"><div class="card"><span>Всего</span><b id="total">0</b></div><div class="card"><span>Готовы</span><b id="ready">0</b></div><div class="card"><span>Не хватает</span><b id="missing">0</b></div></div><div class="panel"><div class="toolbar"><input id="q" placeholder="Поиск по дате, номеру, заказчику, Rechnung..."></div><div class="head"><div>Дата</div><div>№ рейса</div><div>Заказчик</div><div>Auftrag</div><div>CMR</div><div>POD</div><div>Rechnung-Nr.</div><div>Документы</div><div>Статус</div><div></div></div><div id="rows"></div></div></main>
<div class="modal" id="addModal"><form class="dialog" id="addForm"><h2>Добавить рейс</h2><div class="grid"><div class="field"><label>Дата</label><input type="date" name="date" required></div><div class="field"><label>№ рейса</label><input name="trip"></div><div class="field full"><label>Заказчик</label><input name="customer" value="DC Cargo" required></div><div class="field full"><label>Rechnung-Nr.</label><input name="rechnungCode"></div></div><div class="actions"><button class="btn alt" type="button" id="cancelAdd">Отмена</button><button class="btn">Сохранить</button></div></form></div>
<div class="modal" id="docsModal"><div class="dialog"><h2 id="docsTitle">Документы</h2><div class="grid"><div class="field"><label>Тип</label><select id="docType"><option value="auftrag">Transportauftrag</option><option value="cmr">CMR</option><option value="pod">POD / Lieferschein</option><option value="rechnung">Rechnung</option><option value="other">Другое</option></select></div><div class="field"><label>Файлы</label><input id="files" type="file" multiple></div></div><div class="actions"><button class="btn" id="upload">Загрузить</button></div><div id="docList" class="docs"></div><div class="actions"><button class="btn alt" id="closeDocs">Закрыть</button></div></div></div>
<script>
let pass=sessionStorage.getItem('tsubera-pass')||'',trips=[],activeTrip=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ask(){}
async function api(p,o={}){ask();let r=await fetch(p,{...o,headers:{...(o.headers||{}),'x-app-password':pass}});if(r.status===401){sessionStorage.removeItem('tsubera-pass');pass='';ask();return api(p,o)}let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function status(t){if(t.rechnungCode)return '<span class="status ok">Rechnung создан</span>';if(t.auftrag&&t.cmr&&t.pod)return '<span class="status ok">Можно создать Rechnung</span>';let m=[];if(!t.auftrag)m.push('Auftrag');if(!t.cmr)m.push('CMR');if(!t.pod)m.push('POD');return '<span class="status wait">Не хватает: '+m.join(', ')+'</span>'}
async function load(){let d=await api('/api/trips');trips=d.trips||[];render()}
function render(){let q=document.getElementById('q').value.toLowerCase();let list=trips.filter(t=>[t.date,t.trip,t.customer,t.rechnungCode].join(' ').toLowerCase().includes(q));total.textContent=trips.length;ready.textContent=trips.filter(t=>!t.rechnungCode&&t.auftrag&&t.cmr&&t.pod).length;missing.textContent=trips.filter(t=>!(t.auftrag&&t.cmr&&t.pod)).length;rows.innerHTML=list.map(t=>'<div class="row"><div data-label="Дата">'+esc(t.date)+'</div><div data-label="№ рейса"><b>'+esc(t.trip||'—')+'</b></div><div data-label="Заказчик">'+esc(t.customer)+'</div>'+['auftrag','cmr','pod'].map(k=>'<div data-label="'+k+'"><input type="checkbox" '+(t[k]?'checked':'')+' onchange="toggle(\''+t.id+'\',\''+k+'\',this.checked)"></div>').join('')+'<div data-label="Rechnung-Nr."><input class="rn" value="'+esc(t.rechnungCode||'')+'" onchange="rechnung(\''+t.id+'\',this.value)"></div><div data-label="Документы"><button class="btn alt" onclick="openDocs(\''+t.id+'\')">Документы</button></div><div data-label="Статус">'+status(t)+'</div><div><button class="btn alt" onclick="delTrip(\''+t.id+'\')">×</button></div></div>').join('')}
window.toggle=async(id,k,v)=>{await api('/api/trips/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({[k]:v})});await load()}
window.rechnung=async(id,v)=>{await api('/api/trips/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({rechnungCode:v.trim()})});await load()}
window.delTrip=async id=>{if(confirm('Удалить рейс и документы?')){await api('/api/trips/'+id,{method:'DELETE'});await load()}}
window.openDocs=async id=>{activeTrip=id;let t=trips.find(x=>x.id===id);docsTitle.textContent='Документы · '+(t?.trip||t?.customer||'рейс');docsModal.classList.add('open');await loadDocs()}
async function loadDocs(){let d=await api('/api/trips/'+activeTrip+'/documents');docList.innerHTML=(d.documents||[]).map(x=>'<div class="doc"><b>'+esc(x.docType)+'</b><div><div>'+esc(x.name)+'</div><div class="muted">'+Math.round((x.size||0)/1024)+' KB</div></div><div><button class="btn alt" onclick="openDoc(\''+x.id+'\')">Открыть</button> <button class="btn alt" onclick="delDoc(\''+x.id+'\')">Удалить</button></div></div>').join('')||'<div class="muted">Документов пока нет</div>'}
window.openDoc=async id=>{let d=await api('/api/documents/'+id+'/link');window.open(d.url,'_blank')}
window.delDoc=async id=>{if(confirm('Удалить файл?')){await api('/api/documents/'+id,{method:'DELETE'});await loadDocs();await load()}}
upload.onclick=async()=>{let fs=[...files.files];if(!fs.length)return alert('Выбери файл');for(const f of fs){let b64=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});await api('/api/trips/'+activeTrip+'/documents',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({docType:docType.value,name:f.name,mime:f.type||'application/octet-stream',dataBase64:b64})})}files.value='';await loadDocs();await load()}
add.onclick=()=>addModal.classList.add('open');cancelAdd.onclick=()=>addModal.classList.remove('open');closeDocs.onclick=()=>docsModal.classList.remove('open');q.oninput=render;addForm.onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);await api('/api/trips',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({date:f.get('date'),trip:(f.get('trip')||'').trim(),customer:f.get('customer'),rechnungCode:(f.get('rechnungCode')||'').trim()})});e.target.reset();e.target.customer.value='DC Cargo';addModal.classList.remove('open');await load()};load().catch(e=>alert(e.message));
</script></body></html>
