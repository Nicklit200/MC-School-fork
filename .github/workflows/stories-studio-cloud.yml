name: Stories Studio cloud connector

on:
  pull_request:
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/settings/StoryStudio*'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/McpSiteFunctionRegistry.java'
      - 'backend/src/main/resources/db/migration/*story_studio*'
      - 'backend/src/test/java/com/mcschool/flashcard/settings/StoryStudio*'
      - 'frontend/src/api/storyStudio.ts'
      - 'frontend/src/pages/admin/AdminMindcraftiStudioPage*'
      - '.github/workflows/stories-studio-cloud.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test privacy, validation and versioned project retrieval
        working-directory: backend
        run: ./mvnw -B -ntp '-Dtest=StoryStudioProjectServiceTest,McpSiteFunctionsServiceTest' test
      - name: Package backend
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package
  studio-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Test cloud synchronization and original design preservation
        working-directory: frontend
        run: npm test -- src/pages/admin/AdminMindcraftiStudioPage.test.tsx
      - name: Compile and build frontend
        working-directory: frontend
        run: npm run build
