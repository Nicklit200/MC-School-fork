name: Manual completed lesson report
on:
  pull_request:
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/CompletedLessonReport*'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/PostLessonSkill*'
      - 'backend/src/main/resources/db/migration/V121_1__completed_lesson_report.sql'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/CompletedLessonReport*.java'
      - 'frontend/src/pages/teacher/CompletedLessonReportDialog*'
      - 'frontend/src/pages/teacher/completed-lesson-report.css'
      - 'frontend/src/pages/teacher/LessonWorkspacePage*'
      - 'frontend/src/api/onlineClasses.ts'
      - '.github/workflows/completed-lesson-report.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install report PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Verify report access, evidence and PDF output
        working-directory: backend
        run: mvn -B -ntp -Dtest=CompletedLessonReportTest,CompletedLessonReportIntegrationTest,PostLessonSkillReviewTest test
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- src/pages/teacher/CompletedLessonReportDialog.test.tsx src/pages/teacher/LessonWorkspacePage.test.tsx
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
