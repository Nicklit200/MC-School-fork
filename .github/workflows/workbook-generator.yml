name: Workbook generator validation
on:
  pull_request:
    branches: [integration/railway-and-ux]
    paths:
      - 'backend/**'
      - '.github/workflows/workbook-generator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify production backend without paid AI
        run: docker build --progress=plain -t mindcrafti-workbook-test ./backend
