name: Skills board verification
on:
  push:
    branches: [feature/skills-board-v1]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: skills_test
          POSTGRES_PASSWORD: skills_test
          POSTGRES_DB: skills_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize additive seed and navigation
        run: python tools/skills_board_bootstrap.py
      - name: Build the actual school frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Validate skill graph
        run: node --test tests/skills/model.test.mjs
      - name: Test backend permissions and PostgreSQL persistence
        working-directory: backend
        env:
          SKILLS_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/skills_test
        run: mvn -B -Dtest='SkillBoard*Test' test
      - name: Install browser test runtime
        run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - name: Exercise board editing and persistence in browser
        run: python tests/skills/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skills-board-test-results
          path: |
            skills-overview.png
            backend/target/surefire-reports/
      - name: Commit tested generated migration and navigation on feature branch only
        if: github.ref == 'refs/heads/feature/skills-board-v1'
        run: |
          git add frontend/src/App.tsx frontend/src/components/Layout.tsx backend/src/main/resources/db/migration/V65__add_skill_boards.sql
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Integrate tested skills route, navigation and grade-six database seed'
            git push origin HEAD:feature/skills-board-v1
          fi
