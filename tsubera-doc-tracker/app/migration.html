<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Перенос · Tsubera</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:system-ui,sans-serif;padding:24px}main{max-width:760px;margin:auto;background:white;padding:24px;border:1px solid #e5e7eb;border-radius:16px}h1{margin-top:0}.muted{color:#6b7280}button,a.button{background:#111827;color:white;border:0;border-radius:9px;padding:11px 14px;font:inherit;cursor:pointer;display:inline-block;text-decoration:none}input{display:block;padding:10px;margin:10px 0;max-width:100%;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fb;padding:14px;border-radius:10px}button:disabled{opacity:.5;cursor:wait}#notice{line-height:1.5}</style></head><body><main><h1>Tsubera · перенос данных</h1><p class="muted">Исходная серверная база и документы сохраняются отдельно. Приложение будет включено после проверки переноса.</p><p id="notice" role="status" aria-live="polite">Проверка резервной копии…</p><pre id="counts"></pre><a class="button" href="/migration/backup">Скачать исходную резервную копию</a><form id="upload"><h2>Проверенный архив Tsubera</h2><label>ZIP<input id="file" type="file" accept=".zip,application/zip" required></label><label>SHA256 архива<input id="sha" type="text" minlength="64" maxlength="64" pattern="[A-Fa-f0-9]{64}" required></label><button id="send" type="submit">Проверить и восстановить отдельно</button></form></main><script>const notice=document.getElementById('notice'),counts=document.getElementById('counts');async function status(){const r=await fetch('/migration/status');if(r.status===401){location.assign('/login');return}const j=await r.json();if(!r.ok)throw new Error(j.error);counts.textContent=JSON.stringify({исходная_база:j.baseline.verification.rows,перенесено:j.imported?.verification.rows||null},null,2);notice.textContent=j.imported?'Архив проверен и восстановлен. Ожидается переключение приложения.':'Резервная копия исходного сервера готова и проверена.'}document.getElementById('upload').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('send');b.disabled=true;notice.textContent='Загрузка и проверка архива…';try{const f=document.getElementById('file').files[0];if(!f)throw new Error('Выберите ZIP');const r=await fetch('/migration/upload',{method:'POST',headers:{'content-type':'application/zip','x-tsubera-sha256':document.getElementById('sha').value.trim()},body:f});const j=await r.json();if(!r.ok)throw new Error(j.error);await status()}catch(e){notice.textContent=e.message}finally{b.disabled=false}});status().catch(e=>notice.textContent=e.message);</script></body></html>
