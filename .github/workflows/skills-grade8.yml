name: Grade 8 M8 skills verification
on:
  push:
    branches: [feature/skills-grade8-m8]
permissions:
  contents: read
concurrency:
  group: skills-grade8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: skills8
          POSTGRES_PASSWORD: skills8
          POSTGRES_DB: skills8
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Check skills board JavaScript
        run: node --check frontend/public/skills-board/board.js
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Compile backend
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Validate Grade 8 board migrations
        env:
          PGPASSWORD: skills8
        run: |
          psql -h localhost -U skills8 -d skills8 -v ON_ERROR_STOP=1 -c 'CREATE TABLE users(id UUID PRIMARY KEY);'
          psql -h localhost -U skills8 -d skills8 -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/migration/V65__add_skill_boards.sql
          psql -h localhost -U skills8 -d skills8 -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/migration/V66__add_student_skill_mastery.sql
          psql -h localhost -U skills8 -d skills8 -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/migration/V67__add_grade8_m8_skill_board.sql
          psql -h localhost -U skills8 -d skills8 -v ON_ERROR_STOP=1 -c "SELECT id, revision, data->>'title' AS title FROM skill_boards ORDER BY id;"
