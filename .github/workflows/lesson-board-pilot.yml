name: Lesson board pilot CI

on:
  pull_request:
    paths:
      - "backend/src/main/java/com/mcschool/flashcard/lessonboard/**"
      - "backend/src/main/resources/db/migration/V76__create_lesson_board_operations.sql"
      - "backend/src/main/java/com/mcschool/flashcard/config/SecurityConfig.java"
      - "backend/src/test/java/com/mcschool/flashcard/lessonboard/**"
      - "frontend/src/pages/lesson-board/**"
      - "frontend/src/api/lessonBoard.ts"
      - "frontend/src/App.tsx"
      - "frontend/src/pages/teacher/LessonDetailPage.tsx"
      - ".github/workflows/lesson-board-pilot.yml"
  push:
    branches:
      - integration/online-classes-dual-provider-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile backend
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package
      - name: Test whiteboard authorization
        working-directory: backend
        run: ./mvnw -B -ntp -Dtest=LessonBoardControllerTest,OnlineClassPilotAuthorizationManagerTest,LessonBoardMigrationIntegrationTest test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
