name: Full online classroom integration

on:
  pull_request:
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/liveclasses/**'
      - 'backend/src/test/java/com/mcschool/flashcard/liveclasses/**'
      - 'backend/src/main/resources/db/migration/V7[7-9]__*'
      - 'backend/src/main/resources/db/migration/V8[01]__*'
      - 'backend/pom.xml'
      - 'frontend/src/features/online-classes/**'
      - 'frontend/src/pages/online-classes/**'
      - 'frontend/src/pages/student/StudentLessonsCalendarPage.tsx'
      - 'frontend/package*.json'
      - 'frontend/vitest.config.ts'
      - '.github/workflows/farhad-full-classroom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-live-class-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Compile all app and tests
        working-directory: frontend
        run: npm run build
      - name: Exercise real-time board, chat and participant controls
        working-directory: frontend
        run: npm test

  backend-live-class-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shared Testcontainers PostgreSQL serves many Spring test contexts.
    # Use small pools so parallel contexts do not exhaust server connections.
    env:
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '2'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile full backend
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package
      - name: Exercise LiveKit authorization, migrations and recordings with Testcontainers PostgreSQL
        working-directory: backend
        run: ./mvnw -B -ntp '-Dtest=*OnlineClass*,*LiveKit*,*WaitingRoom*,*PersonalBoard*,*AnnotationPayload*,*ClassRetention*' test
