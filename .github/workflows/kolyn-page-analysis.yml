name: Kolyn incremental page analysis

on:
  pull_request:
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/liveclasses/Kolin*'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/AiLessonPilotService.java'
      - 'backend/src/main/resources/db/migration/V122__kolyn_page_analysis.sql'
      - 'backend/src/test/java/com/mcschool/flashcard/liveclasses/Kolin*'
      - 'frontend/src/features/online-classes/**'
      - 'frontend/src/api/kolin.ts'
      - '.github/workflows/kolyn-page-analysis.yml'
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test page analysis and existing review safeguards
        working-directory: backend
        run: mvn -B -ntp -Dtest=KolinPageAnalysisServiceTest,KolinPageAnalysisStoreIntegrationTest,KolinBoardReviewServiceTest,KolinChatServiceTest test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm test -- src/features/online-classes/useAutomaticPageAnalysis.test.ts src/features/online-classes/useKolinBoardReview.test.ts src/features/online-classes/useKolinChat.test.ts src/features/online-classes/DocumentWhiteboardPanel.test.tsx src/features/online-classes/KolinRichText.test.tsx
