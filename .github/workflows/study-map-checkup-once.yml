name: Isolated Study Map checkup
on:
  push:
    branches: [study-map-checkup-20261020]
permissions:
  contents: write
jobs:
  checkup:
    if: github.ref == 'refs/heads/study-map-checkup-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact scoped changes
        run: |
          python ops/study-checkup/prepare.py
          python - <<'PY'
          from pathlib import Path
          p=Path('personal-study-map/tests/browser-checkup.py')
          s=p.read_text()
          s=s.replace("phone=other.new_page();phone.clock", "phone=other.new_page();phone.on('pageerror',lambda e: print('EXPECTED injected network interruption:',str(e),flush=True) if calls.get('fault_window') and '/api/quiz-sync' in str(e) and 'access control checks' in str(e) else errors.append('phone: '+str(e)));phone.clock")
          s=s.replace("phone.goto(url)\n", "phone.goto(url)\n    phone.wait_for_function('window.studyBoardCards?.allExams?.().length>0 && window.CardQuizEngine')\n")
          s=s.replace("phone.evaluate(fixture);phone.locator('#flashcard-toggle').click(force=True)", "phone.evaluate(fixture);phone.locator('#flashcard-toggle').click(timeout=10000)")
          s=s.replace("page.locator('[data-action=\"home\"]').click()", "page.locator('[data-action=\"home\"]').first.click()")
          s=s.replace("req=route.request\n", "req=route.request\n        cors_headers={'access-control-allow-origin':req.headers.get('origin','*'),'access-control-allow-methods':'GET,POST,OPTIONS','access-control-allow-headers':'authorization,content-type','access-control-max-age':'600'}\n")
          s=s.replace('route.fulfill(status=', 'route.fulfill(headers=cors_headers,status=')
          s=s.replace("calls['fail']=True;", "calls['fault_window']=True;calls['fail']=True;")
          s=s.replace("    page.evaluate(fixture);page.locator('[data-action=\"home\"]').first.click()", "    calls['fault_window']=False\n    page.evaluate(fixture);page.locator('[data-action=\"home\"]').first.click()")
          p.write_text(s)
          PY
      - name: Syntax and scheduling gates
        run: |
          find personal-study-map -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --test personal-study-map/tests/*.test.mjs
      - name: Install isolated browsers
        run: |
          python -m pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium webkit > /tmp/browser-install.log 2>&1 || { tail -60 /tmp/browser-install.log; exit 1; }
      - name: Browser startup and next-day recovery
        run: python personal-study-map/tests/browser-checkup.py
      - name: Preserve isolated test source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-map-checkup-source
          path: personal-study-map/
          retention-days: 2
      - name: Verify production image gate
        run: docker build -t study-map-checkup personal-study-map
      - name: Commit only tested files to the isolated branch
        run: |
          git config user.name 'Study Map checkup'
          git config user.email '78360431+Nicklit200@users.noreply.github.com'
          git add personal-study-map/flashcards.js personal-study-map/flashcard-engine.js personal-study-map/index.html personal-study-map/Dockerfile personal-study-map/tests/browser-checkup.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(study-map): tested synchronization, Berlin dates and blocking build checks'
            git push origin HEAD:study-map-checkup-20261020
          fi
