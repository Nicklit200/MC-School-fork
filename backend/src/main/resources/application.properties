spring.application.name=flashcard

# --- Database ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:mydb}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:mypassword}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- PDF uploads ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# --- Security ---
app.security.jwt.secret=${JWT_SECRET:local-dev-only-jwt-secret-change-me-1234567890}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.security.jwt.fail-on-insecure-secret=${JWT_FAIL_ON_INSECURE_SECRET:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Initial admin account ---
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:Administrator}

# --- Frontend links ---
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# --- Google Drive ---
app.google-drive.service-account-json=${GOOGLE_SERVICE_ACCOUNT_JSON:}

# --- Google Calendar ---
# Calendar id of the shared/school calendar that contains group lessons.
# The calendar must be shared with the same service account used for Google Drive.
app.google-calendar.calendar-id=${GOOGLE_CALENDAR_ID:}

# --- Email ---
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@mcschool.local}
app.brevo.api-key=${BREVO_API_KEY:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}

# --- Notifications ---
app.notifications.review-reminders.enabled=${REVIEW_REMINDERS_ENABLED:false}
app.notifications.review-reminders.cron=${REVIEW_REMINDERS_CRON:0 0 8 * * *}
app.notifications.review-reminders.zone=${REVIEW_REMINDERS_ZONE:Europe/Berlin}

# Parent alert for today's unfinished PDF homework and/or due flashcards.
# Default cutoff is 19:00 Berlin time. One combined evening push is sent per child.
app.parent-homework-reminders.enabled=${PARENT_HOMEWORK_REMINDERS_ENABLED:true}
app.parent-homework-reminders.cron=${PARENT_HOMEWORK_REMINDERS_CRON:0 0 19 * * *}
app.parent-homework-reminders.zone=${PARENT_HOMEWORK_REMINDERS_ZONE:Europe/Berlin}

# --- Web Push / PWA notifications ---
app.web-push.public-key=${WEB_PUSH_PUBLIC_KEY:}
app.web-push.private-key=${WEB_PUSH_PRIVATE_KEY:}
app.web-push.subject=${WEB_PUSH_SUBJECT:mailto:no-reply@mindcrafti.de}
app.web-push.reminders.enabled=${WEB_PUSH_REMINDERS_ENABLED:false}
app.web-push.reminders.cron=${WEB_PUSH_REMINDERS_CRON:0 0 8 * * *}
app.web-push.reminders.zone=${WEB_PUSH_REMINDERS_ZONE:Europe/Berlin}

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

# --- Online classes (LiveKit) -------------------------------------------------
# Disabled by default: with enabled=false the existing Google Meet / Soniox
# lesson flow is unchanged. Secrets are server-side only and are never returned
# to the browser.
app.online-classes.enabled=${ONLINE_CLASSES_ENABLED:false}
app.online-classes.livekit-url=${LIVEKIT_URL:}
app.online-classes.livekit-api-key=${LIVEKIT_API_KEY:}
app.online-classes.livekit-api-secret=${LIVEKIT_API_SECRET:}
app.online-classes.recording-enabled=${LIVEKIT_RECORDING_ENABLED:false}
app.online-classes.transcription-enabled=${ONLINE_CLASS_TRANSCRIPTION_ENABLED:false}
# Students may connect from 15 minutes before the scheduled start until 60
# minutes after the scheduled end; teachers may open/start earlier.
app.online-classes.join-window-before-start=${ONLINE_CLASS_JOIN_WINDOW_BEFORE:15m}
app.online-classes.join-window-after-end=${ONLINE_CLASS_JOIN_WINDOW_AFTER:60m}
# Participant tokens are short-lived; clients reconnect to refresh.
app.online-classes.token-ttl=${ONLINE_CLASS_TOKEN_TTL:10m}

# --- Class artifact storage (S3-compatible: AWS S3, Cloudflare R2, MinIO) -----
# Recording bytes live here, never in PostgreSQL. Credentials are server-side
# only and are never returned to a browser or written to a log.
app.class-storage.endpoint=${CLASS_ARTIFACT_STORAGE_ENDPOINT:}
app.class-storage.region=${CLASS_ARTIFACT_STORAGE_REGION:auto}
app.class-storage.bucket=${CLASS_ARTIFACT_STORAGE_BUCKET:}
app.class-storage.access-key=${CLASS_ARTIFACT_STORAGE_ACCESS_KEY:}
app.class-storage.secret-key=${CLASS_ARTIFACT_STORAGE_SECRET_KEY:}
# R2 and MinIO generally need path-style addressing; AWS S3 does not.
app.class-storage.path-style=${CLASS_ARTIFACT_STORAGE_PATH_STYLE:true}
# Signed URLs are credentials: keep the lifetime short.
app.class-storage.signed-url-ttl=${CLASS_ARTIFACT_SIGNED_URL_TTL:10m}
app.class-storage.recording-retention-days=${CLASS_RECORDING_RETENTION_DAYS:90}
app.class-storage.transcript-retention-days=${CLASS_TRANSCRIPT_RETENTION_DAYS:365}

# --- Class transcription (LiveKit Agents + Soniox) ----------------------------
# The agent registers with LiveKit under this name and is dispatched into a room
# only when a teacher starts transcription. SONIOX_API_KEY belongs to the
# transcription service, NOT to this application.
app.online-classes.transcription-agent-name=${ONLINE_CLASS_TRANSCRIPTION_AGENT:mc-transcriber}
# Shared secret the worker presents on transcript ingestion. Never an end-user
# JWT, and never exposed to a browser.
app.online-classes.transcription-internal-token=${TRANSCRIPTION_INTERNAL_TOKEN:}

# --- Class artifact retention -------------------------------------------------
# Nightly sweep. Deletion is retried on the next run if the object store is
# unreachable, so a failure never orphans a file.
app.online-classes.retention.cron=${CLASS_RETENTION_CRON:0 30 3 * * *}
app.online-classes.retention.zone=${CLASS_RETENTION_ZONE:Europe/Berlin}
# Dev/QA only: lets a teacher create a class without Google Calendar so the
# feature can be demonstrated. MUST stay false in production.
app.online-classes.allow-test-classes=${ONLINE_CLASS_ALLOW_TEST_CLASSES:false}
