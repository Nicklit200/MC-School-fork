name: Student lessons calendar

on:
  push:
    branches: [feature/student-lessons-calendar]
  pull_request:
    branches: [integration/railway-and-ux]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/student-lessons-calendar.yml'

permissions:
  contents: read

concurrency:
  group: student-lessons-calendar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- src/pages/teacher/monthReadiness.test.ts src/pages/teacher/WorkbookDraftPreviewPage.test.tsx src/components/PushQuickStart.test.tsx
      - name: Verify combined lesson and homework calendar
        run: npm test -- src/pages/teacher/StudentHomeworksPage.test.tsx src/pages/parent/ParentPage.test.tsx src/lib/homeworkHistory.test.ts src/lib/studentCalendar.test.ts
      - run: npm run build

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp -Dtest=MonthlyReadinessCalculatorTest,WorkbookDraftDownloadServiceTest test
      - name: Verify lesson lifecycle evidence and student history access
        run: mvn -B -ntp -Dtest=LessonExecutionSummaryServiceTest,StudentLessonHistoryMembershipTest,ManualLessonApiTest,ManualLessonScheduleTest test
      - run: mvn -B -ntp -DskipTests package
