name: Verify nullable skill core hotfix
on:
  push:
    branches: [hotfix/nullable-skill-core]
permissions:
  contents: read
concurrency:
  group: verify-nullable-skill-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compile backend
        working-directory: backend
        run: mvn -B -DskipTests package
