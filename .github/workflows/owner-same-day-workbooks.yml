name: Owner same-day workbook generation

on:
  pull_request:
    branches: [integration/railway-and-ux]
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/OwnerSameDayWorkbookService.java'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/OwnerWorkbookLessonCreated.java'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/AiLessonPilotController.java'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/AiLessonPilotService.java'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/AiLessonPilotScheduler.java'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/ManualLessonService.java'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/WorkbookContentService.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/OwnerSameDayWorkbookServiceTest.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/AiLessonPilotSchedulerTest.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/ManualLessonServiceTest.java'
      - 'frontend/src/pages/teacher/LessonDetailPage.tsx'
      - 'frontend/src/api/aiPilot.ts'
      - '.github/workflows/owner-same-day-workbooks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp '-Dtest=OwnerSameDayWorkbookServiceTest,ManualLessonServiceTest,AiLessonPilotSchedulerTest' test

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
