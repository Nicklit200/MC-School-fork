name: Personal lesson worksheets

on:
  pull_request:
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/**'
      - 'backend/src/main/java/com/mcschool/flashcard/liveclasses/**'
      - 'backend/src/main/resources/db/migration/V95__*'
      - 'backend/src/main/resources/db/migration/V96__*'
      - 'backend/src/test/java/com/mcschool/flashcard/**'
      - 'frontend/**'
      - '.github/workflows/personal-lesson-workbooks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify pilot, student isolation, retries and PostgreSQL persistence
        working-directory: backend
        run: ./mvnw -B -ntp '-Dtest=PersonalLessonWorkbook*,PersonalLessonAnswers*,PersonalLessonDocumentServiceTest,PersonalWorkbookAnnotationAccessTest,CompletedPersonalWorkbookDocumentTest,CompletedLessonArchivePreparationTest,CompletedLessonArchivePreparationIntegrationTest,McpPersonalLessonWorkbookToolsTest,OnlineClassDocumentIntegrationTest,PersonalBoardAccessIntegrationTest,McpOperationReceiptIntegrationTest' test
      - name: Require PostgreSQL persistence tests to execute
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          for name, minimum in {'PersonalLessonWorkbookPersistenceIntegrationTest': 7, 'PersonalLessonAnswersPersistenceIntegrationTest': 5, 'CompletedLessonArchivePreparationIntegrationTest': 4}.items():
              report = Path('backend/target/surefire-reports') / f'TEST-com.mcschool.flashcard.lessons.{name}.xml'
              suite = ElementTree.parse(report).getroot()
              assert int(suite.get('tests', '0')) >= minimum, f'{name}: missing database coverage'
              for field in ('skipped', 'failures', 'errors'):
                  assert int(suite.get(field, '0')) == 0, f'{name}: {field} must be zero'
          PY
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- src/features/online-classes/BoardSwitcher.test.tsx src/features/online-classes/boards.test.ts src/features/online-classes/DocumentWhiteboardPanel.test.tsx src/features/online-classes/useBoardDocument.test.ts src/features/online-classes/OnlineClassRoom.test.tsx src/features/online-classes/AnswersPanel.test.tsx src/features/online-classes/AnswersPanelResizer.test.tsx src/features/online-classes/useAnswersPanel.test.ts src/features/online-classes/useAnswersPanelRefresh.test.ts src/features/online-classes/usePdf.test.ts src/api/lessonPreparationAnswers.test.ts src/pages/teacher/PersonalWorkbooksPanel.test.tsx src/pages/teacher/LessonDetailPage.test.tsx
      - run: npm run build
