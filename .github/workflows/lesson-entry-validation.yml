name: Lesson entry validation
on:
  push:
    branches: ['verify/lesson-day-access-20261024']
permissions:
  contents: write
concurrency:
  group: lesson-entry-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '2'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply the reviewed change to the exact working-branch base
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          root = pathlib.Path('.validation')
          data = ''.join((root / ('entry-part-' + str(i))).read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'dca53888d14cef448b268d7f6d299160b3e74cf756e8d7d924384d9a72d20bd2'
          pathlib.Path('/tmp/lesson-entry.patch').write_bytes(patch)
          pathlib.Path('/tmp/entry-refine.py').write_bytes((root / 'refine.py').read_bytes())
          PY
          git checkout --detach fb42adf5271b6f63a09a9be3ce58e949fa120f22
          git apply --check /tmp/lesson-entry.patch
          git apply /tmp/lesson-entry.patch
          python3 /tmp/entry-refine.py
          sed -i 's/com.fasterxml.jackson.databind/tools.jackson.databind/g; s/catch (java.io.IOException ignored)/catch (java.io.IOException | RuntimeException ignored)/g' backend/src/main/java/com/mcschool/flashcard/liveclasses/provider/livekit/LiveKitMediaProvider.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile backend and verify admission, lifecycle, access and media integration
        working-directory: backend
        run: ./mvnw -B -ntp '-Dtest=LessonEntryPolicyTest,*OnlineClass*,*WaitingRoom*,*LiveKit*,*PersonalBoard*,LiveClassAuthorizationArchitectureTest' test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Compile frontend and run complete frontend suite
        working-directory: frontend
        run: |
          npm run build
          npm test -- --maxWorkers=2 --minWorkers=1
      - name: Publish validated commit to verification result only
        run: |
          git config user.name 'Mindcrafti validation'
          git config user.email 'validation@users.noreply.github.com'
          git add backend frontend
          git diff --cached --check
          git commit -m 'Enforce Berlin lesson-day entry, final room closure and reconnect grace'
          git push origin HEAD:refs/heads/validated/lesson-day-access-20261024
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-entry-validation-reports
          path: backend/target/surefire-reports
          retention-days: 3
