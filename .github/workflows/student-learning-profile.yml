name: Student learning profile verification
on:
  push:
    branches: [feature/student-learning-profile-auto-skills]

permissions:
  contents: read

concurrency:
  group: student-learning-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: profile_test
          POSTGRES_PASSWORD: profile_test
          POSTGRES_DB: profile_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Check skills board JavaScript
        run: node --check frontend/public/skills-board/board.js
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Compile backend
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Validate learning profile migration
        env:
          PGPASSWORD: profile_test
        run: |
          psql -h localhost -U profile_test -d profile_test -v ON_ERROR_STOP=1 -c "CREATE TABLE users(id UUID PRIMARY KEY, role VARCHAR(20)); CREATE TABLE student_skill_mastery(student_id UUID, board_id VARCHAR(64), mastery INTEGER);"
          psql -h localhost -U profile_test -d profile_test -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/migration/V68__add_student_learning_profile.sql
          psql -h localhost -U profile_test -d profile_test -v ON_ERROR_STOP=1 -c "INSERT INTO users(id, role) VALUES ('00000000-0000-0000-0000-000000000001','STUDENT'); INSERT INTO student_skill_mastery(student_id, board_id, mastery) VALUES ('00000000-0000-0000-0000-000000000001','grade-8-m8',75); UPDATE users SET grade=NULL WHERE id='00000000-0000-0000-0000-000000000001';"
          psql -h localhost -U profile_test -d profile_test -v ON_ERROR_STOP=1 -c "UPDATE users u SET grade=8 WHERE u.grade IS NULL AND EXISTS (SELECT 1 FROM student_skill_mastery m WHERE m.student_id=u.id AND m.board_id='grade-8-m8' AND m.mastery>0); SELECT grade FROM users WHERE id='00000000-0000-0000-0000-000000000001';"
