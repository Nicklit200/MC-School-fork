name: Post-lesson automatic homework
on:
  pull_request:
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/PostLessonHomework*'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/PostLessonHomeworkReviewMetadataTest.java'
      - 'backend/src/main/resources/db/migration/V115__post_lesson_homework_review.sql'
      - 'frontend/src/pages/teacher/PostLessonHomeworkReviewPage.tsx'
      - 'frontend/src/pages/teacher/post-lesson-homework-review.css'
      - 'frontend/src/pages/teacher/LessonWorkspacePage.tsx'
      - 'frontend/src/App.tsx'
      - 'backend/src/main/java/com/mcschool/flashcard/notifications/PostLessonHomeworkPushService.java'
      - 'backend/src/main/java/com/mcschool/flashcard/notifications/WebPushService.java'
      - 'backend/src/test/java/com/mcschool/flashcard/notifications/PostLessonHomeworkPushServiceTest.java'
      - 'backend/src/main/resources/db/migration/V109__post_lesson_homework_phone_push.sql'
      - 'frontend/src/pages/student/SettingsPage.tsx'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/McpHomeworkDraftValidator.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/McpHomeworkDraftValidatorTest.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/PostLessonHomeworkSafeTrialTest.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/PostLessonHomeworkWorksheetSourceTest.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/PostLessonHomeworkRepairTest.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/PostLessonHomeworkSeriesDiversityTest.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/PostLessonHomeworkPilotAccessTest.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/PostLessonHomeworkFailureTest.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/PostLessonHomeworkProviderFailureTest.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/PostLessonHomeworkRecipientGuardTest.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/PostLessonHomeworkMathTest.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/PostLessonHomeworkPdfIntegrationTest.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/OwnerWorkbookStudioFailureTest.java'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/OwnerWorkbookPdfRenderService.java'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/PostLessonHomeworkPilotAccess.java'
      - 'backend/src/main/resources/db/migration/V108__post_lesson_automatic_homework.sql'
      - 'backend/src/main/resources/db/migration/V114__post_lesson_homework_diagnostics.sql'
      - 'frontend/src/features/online-classes/PostLessonHomeworkDialog*'
      - 'frontend/src/features/online-classes/postLessonHomeworkMessages.ts'
      - 'frontend/src/api/onlineClasses.ts'
      - 'frontend/src/pages/online-classes/OnlineClassPage.tsx'
      - 'frontend/src/components/PostLessonHomeworkStatus*'
      - 'frontend/src/pages/teacher/StudentHomeworksPage.tsx'
      - 'frontend/src/pages/teacher/PostLessonHomeworkReviewPage.tsx'
      - 'frontend/src/pages/teacher/PostLessonHomeworkPdfCanvas*'
      - 'frontend/src/pages/teacher/post-lesson-homework-review.css'
      - 'frontend/src/pages/teacher/StudentHomeworksPage.test.tsx'
      - 'frontend/src/pages/teacher/HomeworkDetailPage.tsx'
      - '.github/workflows/post-lesson-homework.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Homework validator and backend compile
        working-directory: backend
        run: mvn -B -ntp -Dtest=McpHomeworkDraftValidatorTest,PostLessonHomeworkSafeTrialTest,PostLessonHomeworkPushServiceTest,PostLessonHomeworkWorksheetSourceTest,PostLessonHomeworkRepairTest,PostLessonHomeworkSeriesDiversityTest,PostLessonHomeworkPilotAccessTest,PostLessonHomeworkFailureTest,PostLessonHomeworkProviderFailureTest,PostLessonHomeworkRecipientGuardTest,PostLessonHomeworkMathTest,PostLessonHomeworkReviewMetadataTest,OwnerWorkbookStudioFailureTest test
  pdf-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/src/main/resources/owner-workbook-generator/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/src/main/resources/owner-workbook-generator/requirements.txt
      - name: Install native PDF libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 shared-mime-info fonts-dejavu-core fonts-liberation
      - name: Install locked renderer dependencies
        working-directory: backend/src/main/resources/owner-workbook-generator
        run: |
          npm ci --ignore-scripts
          python -m pip install -r requirements.txt
      - name: Generate and verify seven server-built homework PDF pairs
        working-directory: backend
        env:
          MINDCRAFTI_HOMEWORK_PDF_TEST: 'true'
          MINDCRAFTI_WORKBOOK_MODULES: ${{ github.workspace }}/backend/src/main/resources/owner-workbook-generator/node_modules
          PYTHON_BIN: python
        run: mvn -B -ntp -Dtest=PostLessonHomeworkPdfIntegrationTest test
      - name: Retain fictional homework PDFs and QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-lesson-homework-pdf-integration
          path: backend/target/post-lesson-homework-pdf-integration/
          if-no-files-found: ignore
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Post-lesson dialog behavior
        working-directory: frontend
        run: npm test -- src/features/online-classes/PostLessonHomeworkDialog.test.tsx src/components/PostLessonHomeworkStatus.test.tsx src/pages/teacher/StudentHomeworksPage.test.tsx src/pages/teacher/PostLessonHomeworkPdfCanvas.test.tsx
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
