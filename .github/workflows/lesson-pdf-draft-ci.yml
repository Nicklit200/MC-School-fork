name: Lesson PDF draft checks
on:
  push:
    branches:
      - feature/mcp-lesson-pdf-drafts
  pull_request:
    paths:
      - 'backend/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile backend
        working-directory: backend
        run: mvn -B -DskipTests package
