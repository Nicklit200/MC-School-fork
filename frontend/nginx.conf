# Serves the built SPA and reverse-proxies the API to the isolated staging backend,
# so the browser only ever talks to one origin (no CORS needed).

server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 26M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "0" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Staging must never proxy API calls to production. Keep all browser calls
    # same-origin and forward them from nginx to the staging backend.
    location /api/ {
        proxy_pass https://staging-api-production-4c59.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host staging-api-production-4c59.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /actuator/health {
        proxy_pass https://staging-api-production-4c59.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host staging-api-production-4c59.up.railway.app;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
