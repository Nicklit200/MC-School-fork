name: Post-lesson skill review

on:
  pull_request:
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/PostLessonSkill*'
      - 'backend/src/main/java/com/mcschool/flashcard/liveclasses/OnlineClassService.java'
      - 'backend/src/main/resources/db/migration/V121__automatic_post_lesson_skill_review.sql'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/PostLessonSkillReviewTest.java'
      - 'frontend/src/features/online-classes/PostLessonHomeworkDialog*'
      - 'frontend/src/api/onlineClasses.ts'
      - '.github/workflows/post-lesson-skill-review.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Check score safety, strict evidence and server compilation
        working-directory: backend
        run: mvn -B -ntp -Dtest=PostLessonSkillReviewTest test
