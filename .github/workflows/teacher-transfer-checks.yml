name: Teacher transfer checks

on:
  pull_request:
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/TeacherTransferService.java'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/StudentLessonHistory*.java'
      - 'backend/src/main/java/com/mcschool/flashcard/users/AdminAccountController.java'
      - 'backend/src/main/java/com/mcschool/flashcard/users/AdminAccountResponse.java'
      - 'backend/src/main/java/com/mcschool/flashcard/users/UserRepository.java'
      - 'backend/src/test/java/com/mcschool/flashcard/users/AdminAccountLoadingIntegrationTest.java'
      - 'backend/src/main/java/com/mcschool/flashcard/users/TeacherAssignmentOption.java'
      - 'backend/src/main/java/com/mcschool/flashcard/users/dto/StudentTransferResponse.java'
      - 'backend/src/main/java/com/mcschool/flashcard/users/dto/TransferStudents*.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/TeacherTransferServiceTest.java'
      - 'frontend/src/pages/admin/AdminAccountsPage.tsx'
      - 'frontend/src/pages/teacher/StudentLessonHistoryDetailPage.tsx'
      - 'frontend/src/pages/teacher/StudentLessonsPage.tsx'
      - 'frontend/src/api/client.ts'
      - 'frontend/src/api/types.ts'
      - '.github/workflows/teacher-transfer-checks.yml'
  push:
    branches:
      - feature/teacher-student-transfer-history-20261027
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/TeacherTransferService.java'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/StudentLessonHistory*.java'
      - 'backend/src/main/java/com/mcschool/flashcard/users/AdminAccountController.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/TeacherTransferServiceTest.java'
      - 'frontend/src/pages/admin/AdminAccountsPage.tsx'
      - 'frontend/src/pages/teacher/StudentLessonHistoryDetailPage.tsx'
      - 'frontend/src/pages/teacher/StudentLessonsPage.tsx'
      - '.github/workflows/teacher-transfer-checks.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test account loading and student and group transfer against PostgreSQL
        working-directory: backend
        run: ./mvnw -B -ntp -Dtest=TeacherTransferServiceTest,AdminAccountLoadingIntegrationTest test
      - name: Require executed account loading regressions without skips
        run: |
          python3 - <<'PY'
          from xml.etree import ElementTree
          suite = ElementTree.parse('backend/target/surefire-reports/TEST-com.mcschool.flashcard.users.AdminAccountLoadingIntegrationTest.xml').getroot()
          assert int(suite.get('tests', '0')) >= 5
          for count in ('skipped', 'failures', 'errors'):
              assert int(suite.get(count, '0')) == 0, f'Account loading: {count} must be zero'
          PY

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
