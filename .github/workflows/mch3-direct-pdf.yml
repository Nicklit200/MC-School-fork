name: MCH3 direct PDF validation

on:
  pull_request:
    branches: [integration/railway-and-ux]
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/**'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/**'
      - 'backend/src/main/resources/db/migration/V99__lesson_pdf_document_versions.sql'
      - 'backend/src/main/resources/mcp/**'
      - '.github/scripts/mch3-file-transfer.test.cjs'
      - '.github/scripts/mch3-ui-diagnostic.test.cjs'
      - 'docs/mch3-direct-pdf-upload.md'
      - '.github/workflows/mch3-direct-pdf.yml'

permissions:
  contents: read

jobs:
  direct-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_API_VERSION: '1.44'
      JAVA_TOOL_OPTIONS: '-Dapi.version=1.44'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate the ChatGPT file-transfer panel
        run: |
          node .github/scripts/mch3-file-transfer.test.cjs
          node .github/scripts/mch3-ui-diagnostic.test.cjs
      - name: Validate file inputs, permissions, idempotency and persisted PDFs
        working-directory: backend
        run: ./mvnw -B -ntp -Dtest=ChatGptPdfResolverTest,LessonPreparationMaterialsTest,SharedLessonAnswersMetadataApiTest,NativeLessonPdfCompatibilityTest,McpDirectPdfToolsTest,McpPersonalLessonWorkbookToolsTest,McpSiteFunctionsServiceTest,McpSiteFunctionsTransportIntegrationTest,PersonalLessonWorkbookServiceTest,PersonalLessonAnswersServiceTest,PersonalLessonWorkbookPersistenceIntegrationTest,PersonalLessonAnswersPersistenceIntegrationTest test
      - name: Require all real PostgreSQL suites to run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in (
              'McpSiteFunctionsTransportIntegrationTest',
              'PersonalLessonWorkbookPersistenceIntegrationTest',
              'PersonalLessonAnswersPersistenceIntegrationTest',
          ):
              report = ET.parse(Path('backend/target/surefire-reports') / f'TEST-com.mcschool.flashcard.lessons.{name}.xml').getroot()
              assert int(report.attrib['tests']) > 0, name
              assert int(report.attrib['skipped']) == 0, f'{name} must run against PostgreSQL'
              assert int(report.attrib['failures']) + int(report.attrib['errors']) == 0, name
          PY
