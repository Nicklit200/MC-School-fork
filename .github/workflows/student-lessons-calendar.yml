name: Student lessons calendar

on:
  push:
    branches: [feature/student-lessons-calendar]
  pull_request:
    branches: [integration/railway-and-ux]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/student-lessons-calendar.yml'

permissions:
  contents: read

concurrency:
  group: student-lessons-calendar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp -DskipTests package
