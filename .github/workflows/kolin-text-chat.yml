name: Kolin private text chat

on:
  pull_request:
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/liveclasses/Kolin*'
      - 'backend/src/main/java/com/mcschool/flashcard/liveclasses/InteractiveTemplateSpec.java'
      - 'backend/src/test/java/com/mcschool/flashcard/liveclasses/InteractiveTemplateSpecTest.java'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/AiLessonPilotService.java'
      - 'backend/src/test/java/com/mcschool/flashcard/**/*Kolin*'
      - 'frontend/src/api/kolin*'
      - 'frontend/src/features/online-classes/**'
      - 'frontend/src/styles/**'
      - 'frontend/e2e/kolin*'
      - '.github/workflows/kolin-text-chat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B '-Dtest=*Kolin*Test,InteractiveTemplateSpecTest' test
      - run: mvn -B -DskipTests package
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm install --no-save @playwright/test@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=e2e/kolin.playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolin-browser-results
          path: frontend/test-results/kolin/
