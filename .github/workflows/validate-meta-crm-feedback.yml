name: Validate production Meta CRM feedback

on:
  pull_request:
    branches:
      - integration/railway-and-ux
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/trialleads/TrialLeadMetaController.java'
      - 'backend/src/test/java/com/mcschool/flashcard/trialleads/TrialLeadMetaControllerTest.java'
      - 'backend/src/main/resources/db/migration/V60__create_trial_lead_meta_conversions.sql'
      - 'frontend/src/api/trialLeads.ts'
      - 'frontend/src/pages/admin/TrialLeadsPage.tsx'
      - 'frontend/src/trial-leads.css'
      - '.github/workflows/validate-meta-crm-feedback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run Meta CAPI unit tests
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B -Dtest=TrialLeadMetaControllerTest test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
