spring.application.name=flashcard

# --- Database ---
# Defaults match the local docker-compose PostgreSQL (see compose.yaml).
# Override via environment variables in any non-local environment.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:mydb}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:mypassword}

# The schema is owned by Flyway migrations (src/main/resources/db/migration).
# Hibernate only validates that entities match the migrated schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Security ---
# HS256 signing key, minimum 32 characters. The default is for local development
# only; production deployments MUST set JWT_SECRET.
app.security.jwt.secret=${JWT_SECRET:local-dev-only-jwt-secret-change-me-1234567890}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
# When true, the app refuses to start if the insecure built-in secret is used.
# Left false for local dev; set true in production (see docker-compose.prod.yml).
app.security.jwt.fail-on-insecure-secret=${JWT_FAIL_ON_INSECURE_SECRET:false}

# Comma-separated list of origins allowed to call the API from a browser.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Initial admin account (created at startup when no admin exists yet) ---
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:Administrator}

# --- Frontend links (used inside notification emails) ---
# Base URL of the deployed web app; activation and login links point here.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# --- Google Drive ---
# Full service-account JSON stored as a Railway secret/environment variable.
app.google-drive.service-account-json=${GOOGLE_SERVICE_ACCOUNT_JSON:}

# --- Email (transactional) ---
# When false (default) invitations and reminders are only logged. To send real
# email set MAIL_ENABLED=true and configure BREVO_API_KEY for the Brevo
# Transactional Email API.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@mcschool.local}
app.brevo.api-key=${BREVO_API_KEY:}
# Legacy SMTP settings are kept for backward compatibility with old deployments.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}

# --- Notifications ---
# Daily spaced-repetition review reminders. Disabled by default; when enabled the
# 8:00 job emails (or logs) each student who has cards due (see ReviewReminderScheduler).
app.notifications.review-reminders.enabled=${REVIEW_REMINDERS_ENABLED:false}
app.notifications.review-reminders.cron=${REVIEW_REMINDERS_CRON:0 0 8 * * *}
app.notifications.review-reminders.zone=${REVIEW_REMINDERS_ZONE:Europe/Berlin}

# --- Web Push / PWA notifications ---
# Generate one VAPID key pair and keep the private key only in Railway secrets.
app.web-push.public-key=${WEB_PUSH_PUBLIC_KEY:}
app.web-push.private-key=${WEB_PUSH_PRIVATE_KEY:}
app.web-push.subject=${WEB_PUSH_SUBJECT:mailto:no-reply@mindcrafti.de}

# --- Actuator ---
management.endpoints.web.exposure.include=health
# A mail-server outage must not make the app report unhealthy (and get killed by
# a load balancer); invitations degrade to logging instead.
management.health.mail.enabled=false
