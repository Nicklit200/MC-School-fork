# Serves the built SPA and reverse-proxies the API to the backend container, so
# the browser only ever talks to one origin (no CORS needed).

# Don't advertise the nginx version (information disclosure).
server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mobile camera photos are commonly several MB. Keep this aligned with the
    # Spring multipart limit so uploads are not rejected by nginx first.
    client_max_body_size 26M;

    # --- Security headers (applied to every response; no location redefines
    # add_header, so these are inherited by all locations below) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Legacy header; disabled because a real CSP is in force.
    add_header X-XSS-Protection "0" always;
    # 'unsafe-inline' is only allowed for styles (React sets inline style
    # attributes); scripts are restricted to same-origin bundles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Honoured only over HTTPS; safe to send on HTTP (browsers ignore it there).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Forward API calls to the Railway backend while keeping the browser same-origin.
    location /api/ {
        proxy_pass https://mindcrafti-school-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host mindcrafti-school-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Health passthrough (optional convenience).
    location /actuator/health {
        proxy_pass https://mindcrafti-school-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host mindcrafti-school-production.up.railway.app;
    }

    # SPA client-side routing: always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
