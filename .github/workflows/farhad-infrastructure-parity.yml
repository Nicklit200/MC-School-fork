name: Farhad infrastructure parity

on:
  pull_request:
    paths:
      - 'frontend/Dockerfile'
      - 'frontend/nginx.conf.template'
      - 'frontend/src/auth/ProtectedRoute.tsx'
      - 'frontend/src/auth/ProtectedRoute.test.tsx'
      - 'frontend/src/components/Layout.test.tsx'
      - 'frontend/src/features/online-classes/StartOnlineClassButton*'
      - 'frontend/src/i18n/translations.ts'
      - 'frontend/src/App.tsx'
      - 'services/transcription-agent/**'
      - '.github/workflows/farhad-infrastructure-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nginx-livekit-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual production Nginx container
        run: docker build --file frontend/Dockerfile --tag mindcrafti-nginx-parity ./frontend
      - name: Validate runtime CSP, browser permissions, and SPA fallback
        run: |
          docker run --detach --name mindcrafti-nginx-parity \
            --publish 127.0.0.1:8086:80 \
            --env 'LIVEKIT_CSP_ORIGINS=wss://example.livekit.cloud https://example.livekit.cloud' \
            mindcrafti-nginx-parity
          for i in $(seq 1 30); do
            if curl -fsSI http://127.0.0.1:8086/ > /tmp/headers; then break; fi
            sleep 1
          done
          cat /tmp/headers
          grep -Fq 'camera=(self), microphone=(self), display-capture=(self)' /tmp/headers
          grep -Fq "connect-src 'self' wss://example.livekit.cloud https://example.livekit.cloud" /tmp/headers
          grep -Fq "media-src 'self' blob:" /tmp/headers
          curl -fsS http://127.0.0.1:8086/online-classes/example > /tmp/room
          grep -qi '<html' /tmp/room
          curl -fsSI http://127.0.0.1:8086/notebook-camera/index.html > /tmp/notebook-headers
          grep -Fiq 'X-Frame-Options: SAMEORIGIN' /tmp/notebook-headers
          grep -Fq "frame-ancestors 'self'" /tmp/notebook-headers
          curl -fsSI http://127.0.0.1:8086/notebook-camera/signal.mjs > /tmp/notebook-module-headers
          grep -Fiq 'Content-Type: application/javascript' /tmp/notebook-module-headers
          curl -fsS http://127.0.0.1:8086/lesson-notebook/example > /tmp/notebook-route
          grep -qi '<html' /tmp/notebook-route
          curl -fsS http://127.0.0.1:8086/phone-camera > /tmp/phone-route
          grep -qi '<html' /tmp/phone-route
          docker exec mindcrafti-nginx-parity nginx -t

  frontend-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run integrated frontend tests
        working-directory: frontend
        run: npm test

  transcription-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/transcription-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/transcription-agent/requirements-dev.txt
      - name: Install upstream pinned dependencies
        run: pip install -r requirements-dev.txt
      - name: Run upstream transcription-agent tests
        run: pytest -q
