name: Classroom audio focus
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/src/main/java/com/mcschool/flashcard/liveclasses/**'
      - 'backend/src/test/java/com/mcschool/flashcard/liveclasses/**'
      - '.github/workflows/classroom-audio-focus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - working-directory: backend
        run: ./mvnw -B -ntp '-Dtest=OnlineClassAudioFocusServiceTest,OnlineClassAudioFocusAuthorizationTest,LiveKitMediaProviderTest' test
  live-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- src/features/online-classes/audioFocus.test.ts src/features/online-classes/useClassAudioFocus.test.tsx src/features/online-classes/OnlineClassRoom.test.tsx
      - run: npm run build
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Start isolated local SFU
        run: docker run -d --rm --name audio-focus-sfu --network host livekit/livekit-server:v1.13.11 --dev --bind 127.0.0.1 --node-ip 127.0.0.1
      - run: npx playwright test --config=playwright.audio-focus.config.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-audio-focus-failure
          path: frontend/test-results/
      - if: always()
        run: docker stop audio-focus-sfu || true
