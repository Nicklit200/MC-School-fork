name: Owner Workbook Studio

on:
  pull_request:
    branches: [integration/railway-and-ux]
    paths:
      - 'frontend/src/pages/admin/AdminWorkbookStudioPage*'
      - 'frontend/src/api/workbookStudio*'
      - 'frontend/src/components/Layout.tsx'
      - 'frontend/src/App.tsx'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/WorkbookStudio*'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/OwnerWorkbookPdfRenderService.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/WorkbookStudio*'
      - 'backend/src/main/resources/db/migration/V105__owner_workbook_studio_projects.sql'
      - '.github/workflows/workbook-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend unit tests
        working-directory: backend
        run: mvn -B -ntp -Dtest=WorkbookStudioProjectServiceTest,OwnerWorkbookPdfRenderServiceTest test
      - name: Backend build
        working-directory: backend
        run: mvn -B -ntp -DskipTests package
      - name: Frontend install
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Frontend test
        working-directory: frontend
        run: npm run test -- src/api/workbookStudio.test.ts src/pages/admin/AdminWorkbookStudioPage.test.tsx
      - name: Frontend compile and build
        working-directory: frontend
        run: npm run build
