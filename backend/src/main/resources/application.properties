spring.application.name=flashcard

# --- Database ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:mydb}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:mypassword}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- PDF uploads ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# --- Security ---
app.security.jwt.secret=${JWT_SECRET:local-dev-only-jwt-secret-change-me-1234567890}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.security.jwt.fail-on-insecure-secret=${JWT_FAIL_ON_INSECURE_SECRET:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Initial admin account ---
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:Administrator}

# --- Frontend links ---
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# --- Google Drive ---
app.google-drive.service-account-json=${GOOGLE_SERVICE_ACCOUNT_JSON:}

# --- Email ---
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@mcschool.local}
app.brevo.api-key=${BREVO_API_KEY:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}

# --- Notifications ---
app.notifications.review-reminders.enabled=${REVIEW_REMINDERS_ENABLED:false}
app.notifications.review-reminders.cron=${REVIEW_REMINDERS_CRON:0 0 8 * * *}
app.notifications.review-reminders.zone=${REVIEW_REMINDERS_ZONE:Europe/Berlin}

# Parent alert for today's unfinished PDF homework. One alert per homework.
# Default cutoff is 20:00 Berlin time so a red X does not notify immediately after assignment.
app.parent-homework-reminders.enabled=${PARENT_HOMEWORK_REMINDERS_ENABLED:true}
app.parent-homework-reminders.cron=${PARENT_HOMEWORK_REMINDERS_CRON:0 0 20 * * *}
app.parent-homework-reminders.zone=${PARENT_HOMEWORK_REMINDERS_ZONE:Europe/Berlin}

# --- Web Push / PWA notifications ---
app.web-push.public-key=${WEB_PUSH_PUBLIC_KEY:}
app.web-push.private-key=${WEB_PUSH_PRIVATE_KEY:}
app.web-push.subject=${WEB_PUSH_SUBJECT:mailto:no-reply@mindcrafti.de}
app.web-push.reminders.enabled=${WEB_PUSH_REMINDERS_ENABLED:false}
app.web-push.reminders.cron=${WEB_PUSH_REMINDERS_CRON:0 0 8 * * *}
app.web-push.reminders.zone=${WEB_PUSH_REMINDERS_ZONE:Europe/Berlin}

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false
