name: Skills MCP verification
on:
  push:
    branches: [feature/skills-mcp-edit-v1]
permissions:
  contents: write
concurrency:
  group: skills-mcp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: skills_test
          POSTGRES_PASSWORD: skills_test
          POSTGRES_DB: skills_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate new tools without altering existing calls
        run: python tools/enable_skill_board_mcp.py
      - name: Test permissions, graph validation, persistence and MCP transport
        working-directory: backend
        env:
          SKILLS_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/skills_test
        run: mvn -B -Dtest='SkillBoard*Test' test
      - name: Build deployable backend
        working-directory: backend
        run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skills-mcp-tests
          path: backend/target/surefire-reports/
      - name: Commit verified controller to feature branch only
        run: |
          git add backend/src/main/java/com/mcschool/flashcard/lessons/MindcraftiMcpController.java
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Integrate verified live skill-board MCP reading and revision-checked editing'
            git push origin HEAD:feature/skills-mcp-edit-v1
          fi
