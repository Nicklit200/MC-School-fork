name: Grade 8 M8 fast verification
on:
  push:
    branches: [feature/skills-grade8-m8]
permissions:
  contents: read
jobs:
  verify-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Check board JavaScript syntax
        run: node --check frontend/public/skills-board/board.js
      - name: Validate M8 seed JSON
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('backend/src/main/resources/db/migration/V67__add_grade8_m8_skill_board.sql').read_text()
          m=re.search(r'\$seed\$(.*?)\$seed\$',s,re.S)
          assert m, 'M8 JSON seed not found'
          board=json.loads(m.group(1))
          assert board['grade']==8
          ids=[n['id'] for n in board['nodes']]
          assert len(ids)==len(set(ids))
          assert any(n['id']=='m8-root' for n in board['nodes'])
          assert len([n for n in board['nodes'] if n['kind']=='skill']) >= 30
          print(board['title'], len(board['nodes']), len(board['edges']))
          PY
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Compile backend
        working-directory: backend
        run: mvn -B -DskipTests package
