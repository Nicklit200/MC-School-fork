<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#edf2f8" />
    <title>Mindcrafti — Fast Apple Pencil input A/B test</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #edf2f8; color: #162033;
        font-family: system-ui, -apple-system, sans-serif; }
      #pen-lab-root { max-width: 1100px; padding: 12px; margin: auto; }
      .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
        padding: 12px 4px; gap: 8px; }
      h1 { margin: 0; font-size: clamp(20px,4vw,30px); }
      .intro { margin: 5px 0; color: #475569; font-size: 14px; }
      button, a.link { border: 1px solid #cbd5e1; background: white; color: #1e293b;
        border-radius: 8px; padding: 8px 11px; font: inherit; font-size: 14px; cursor: pointer; }
      a.link { display: inline-block; text-decoration: none; }
      .controls { margin: 12px 0; background: white; padding: 10px 12px; border-radius: 10px;
        display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
      .board { display: flex; justify-content: center; padding: 12px 0 40px; }
      .sheet { width: min(100%, 800px); aspect-ratio: 8 / 11; position: relative; flex: none;
        background: white; border-radius: 2px; box-shadow: 0 7px 25px #10263a25;
        touch-action: none; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; overscroll-behavior: contain; -webkit-tap-highlight-color: transparent; }
      .sheet::before { content: ''; position: absolute; inset: 0;
        background: repeating-linear-gradient(to bottom, transparent 0px, transparent 37px,
           #dbeafe 39px, transparent 40px); pointer-events: none; }
      #fast-ink { position: absolute; width: 100%; height: 100%; inset: 0; pointer-events: none; }
      #fast-stats { margin: 0; font-size: 13px; color: #475569; }
      #capture-info { font-size: 12px; color: #64748b; }
      .fast-indicator { display: inline-block; background: #dcfce7; color: #166534;
        font-size: 12px; padding: 4px 7px; border-radius: 5px; }
    </style>
  </head>
  <body>
    <div id="pen-lab-root">
      <header class="head">
        <div>
          <h1>Apple Pencil — быстрый ввод <span class="fast-indicator">Без искусственной паузы</span></h1>
          <p class="intro">Сравни с обычным Pen Lab. Этот лист не использует React, Perfect Freehand,
            перерисовку старых линий или сохранение рисунка после штриха.</p>
        </div>
        <a class="link" href="/pen-lab.html">Вернуться в обычный Pen Lab</a>
      </header>
      <div class="controls">
        <button id="fast-clear" type="button">Очистить лист</button>
        <span id="fast-stats">Штрихов: 0</span>
        <label id="capture-info"><input id="fast-capture" type="checkbox"/> Использовать pointer capture (по умолчанию выключен)</label>
      </div>
      <div class="board">
        <div class="sheet" id="fast-sheet" aria-label="Тестовая доска Apple Pencil">
          <canvas id="fast-ink" width="800" height="1100" aria-label="Рисунок Apple Pencil"></canvas>
        </div>
      </div>
    </div>
    <script type="module" src="/src/pen-lab/telemetryBootstrap.ts"></script>
    <script type="module" src="/src/pen-lab/fast.ts"></script>
  </body>
</html>
